name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose Z-A link (iPhone)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Share link folder as is
        run: npx playwright test --project=iPhone tests/component/team-link-sync --repeat-each=4 --retries=0 --reporter=list
        continue-on-error: true
      - name: Folder then the instrumented copy
        run: npx playwright test --project=iPhone tests/component/team-link-sync tests/zz-za-diagnose.spec.ts --repeat-each=4 --retries=0 --reporter=list
        continue-on-error: true
