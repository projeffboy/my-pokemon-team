name: Showdown data

# Opens an issue for the maintainer when Pokemon Showdown changes data the site uses
on:
  schedule:
    # Twice a day, so that one delayed or dropped run still leaves a notice within a day
    - cron: "41 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  check:
    name: Check Showdown's data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clone Pokemon Showdown
        run: |
          git clone --depth 1 https://github.com/smogon/pokemon-showdown.git ../pokemon-showdown
          git clone --depth 1 --filter=blob:none --sparse https://github.com/smogon/pokemon-showdown-client.git ../pokemon-showdown-client
          git -C ../pokemon-showdown-client sparse-checkout set play.pokemonshowdown.com/src

      - name: Update the data
        run: npm run update:data -- --notice="$RUNNER_TEMP/notice.md"

      - name: Notify the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Pokemon Showdown changed data the site uses
          NOTICE: ${{ runner.temp }}/notice.md
        run: |
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ ! -f "$NOTICE" ]; then
            # The data on master matches Showdown's again
            if [ -n "$issue" ]; then gh issue close "$issue"; fi
          elif [ -z "$issue" ]; then
            gh issue create --title "$TITLE" --body-file "$NOTICE" --assignee "$GITHUB_REPOSITORY_OWNER"
          elif [ "$(gh issue view "$issue" --json body --jq .body)" != "$(cat "$NOTICE")" ]; then
            gh issue edit "$issue" --body-file "$NOTICE"
            gh issue comment "$issue" --body-file "$NOTICE"
          fi
