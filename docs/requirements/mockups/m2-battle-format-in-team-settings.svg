<text x="52" y="491" font-size="13" fill="#222" font-weight="normal" text-anchor="start">The checklist shows which battle format it was judged under; selecting the chip opens the settings.</text>
<text x="500" y="310" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Compared with option A:</text>
<text x="500" y="330" font-size="13" fill="#222" font-weight="normal" text-anchor="start">+ keeps every team setting in one place</text>
<text x="500" y="350" font-size="13" fill="#222" font-weight="normal" text-anchor="start">+ the checklist card stays as compact as it is today</text>
<text x="500" y="370" font-size="13" fill="#222" font-weight="normal" text-anchor="start">−  two steps away from the checklist it affects</text>
<text x="500" y="390" font-size="13" fill="#222" font-weight="normal" text-anchor="start">−  easy to miss, so more teams stay Not set</text>
