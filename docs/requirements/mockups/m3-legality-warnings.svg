<text x="42" y="242" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Leftovers</text>
<rect x="196" y="224" width="110" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="204" y="242" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Pressure</text>
<circle cx="304" cy="90" r="12" fill="#b26a00" stroke="#b26a00" stroke-width="1.5"/>
<text x="304" y="95" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">!</text>
<circle cx="338" cy="90" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="338" y="95" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<rect x="380" y="76" width="580" height="230" rx="6" fill="#e3f0fc" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="670" y="104" font-size="16" fill="#222" font-weight="bold" text-anchor="middle">Team problems (4)</text>
<circle cx="404" cy="135" r="10" fill="#b26a00" stroke="#b26a00" stroke-width="1.5"/>
<text x="404" y="140" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">!</text>
<text x="426" y="140" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Mewtwo is not allowed in OU: Over Used.</text>
<line x1="396" y1="154" x2="944" y2="154" stroke="#bcd3ea" stroke-width="1"/>
<circle cx="404" cy="173" r="10" fill="#b26a00" stroke="#b26a00" stroke-width="1.5"/>
<text x="404" y="178" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">!</text>
<text x="426" y="178" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Gengar cannot have Levitate.</text>
<line x1="396" y1="192" x2="944" y2="192" stroke="#bcd3ea" stroke-width="1"/>
<circle cx="404" cy="211" r="10" fill="#b26a00" stroke="#b26a00" stroke-width="1.5"/>
<text x="404" y="216" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">!</text>
<text x="426" y="216" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Garchomp has 512 EVs (at most 510).</text>
<line x1="396" y1="230" x2="944" y2="230" stroke="#bcd3ea" stroke-width="1"/>
<circle cx="404" cy="249" r="10" fill="#b26a00" stroke="#b26a00" stroke-width="1.5"/>
<text x="404" y="254" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">!</text>
<text x="426" y="254" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Two pokemon hold Leftovers (Item Clause).</text>
<line x1="396" y1="268" x2="944" y2="268" stroke="#bcd3ea" stroke-width="1"/>
<circle cx="358" cy="150" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="358" y="155" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<rect x="380" y="326" width="580" height="56" rx="6" fill="#e3f0fc" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 3"/>
<circle cx="404" cy="354" r="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5"/>
<text x="404" y="359" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">✓</text>
<text x="426" y="359" font-size="14" fill="#222" font-weight="normal" text-anchor="start">No problems found for Gen 9, OU: Over Used.</text>
<circle cx="358" cy="354" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="358" y="359" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<circle cx="32" cy="420" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="32" y="425" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="52" y="425" font-size="13" fill="#222" font-weight="normal" text-anchor="start">A marker on each slot that a problem concerns. Selecting it shows that pokemon&#x27;s problems.</text>
<circle cx="32" cy="456" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="32" y="461" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="52" y="461" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Each rule the team breaks, naming the pokemon, in the site&#x27;s language (REQ-ANLY-18).</text>
<text x="52" y="479" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Rules checked: format, ability, required item, repeated move, training limits, nickname,</text>
<text x="52" y="497" font-size="13" fill="#222" font-weight="normal" text-anchor="start">level, tera type, species clause, item clause (REQ-ANLY-19).</text>
<circle cx="32" cy="524" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="32" y="529" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="52" y="529" font-size="13" fill="#222" font-weight="normal" text-anchor="start">A team that breaks no rule says so, so that silence is never read as &quot;not checked&quot;.</text>
</svg>
