<text x="204" y="138" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Aura Sphere</text>
<rect x="196" y="150" width="110" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="204" y="168" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Recover</text>
<rect x="196" y="180" width="110" height="26" rx="4" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="204" y="198" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Ice Beam</text>
