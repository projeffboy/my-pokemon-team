<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Mock-up M3: team legality warnings">
<title>Mock-up M3: team legality warnings</title>
<rect width="980" height="560" fill="#fff"/>
