<text x="20" y="52" font-size="13" fill="#666" font-weight="normal" text-anchor="start">A Generation 9 team with the OU format. The rules are already computed; only the display is new.</text>
<rect x="20" y="76" width="300" height="190" rx="6" fill="#f3f3f3" stroke="#999" stroke-width="1.5"/>
