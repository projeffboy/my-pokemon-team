<text x="32" y="503" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="52" y="503" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Doubles: Defog counts as hazard removal in Generations 4 and 5 (REQ-ANLY-14).</text>
<text x="52" y="521" font-size="13" fill="#222" font-weight="normal" text-anchor="start">From Generation 6 it counts in both formats, as today (REQ-ANLY-15).</text>
