<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Mock-up M5: taking the current team to the other site version">
<title>Mock-up M5: taking the current team to the other site version</title>
<rect width="980" height="520" fill="#fff"/>
<text x="20" y="30" font-size="18" fill="#222" font-weight="bold" text-anchor="start">M5  Taking the current team to the other site version (P2)</text>
<text x="20" y="52" font-size="13" fill="#666" font-weight="normal" text-anchor="start">The confirmation shown before leaving for the old website: today, and as planned.</text>
<text x="20" y="84" font-size="14" fill="#666" font-weight="bold" text-anchor="start">Today</text>
<rect x="20" y="96" width="460" height="250" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="44" y="132" font-size="18" fill="#222" font-weight="bold" text-anchor="start">Switch to the old website?</text>
<text x="44" y="164" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Your current team won’t transfer to the old</text>
<text x="44" y="184" font-size="14" fill="#222" font-weight="normal" text-anchor="start">website. Teams already saved here will remain</text>
<text x="44" y="204" font-size="14" fill="#222" font-weight="normal" text-anchor="start">on this version.</text>
<rect x="220" y="298" width="70" height="30" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="255.0" y="318.0" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Cancel</text>
<rect x="300" y="298" width="156" height="30" rx="4" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="378.0" y="318.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">Go to old website</text>
<text x="500" y="84" font-size="14" fill="#666" font-weight="bold" text-anchor="start">Planned</text>
<rect x="500" y="96" width="460" height="250" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="524" y="132" font-size="18" fill="#222" font-weight="bold" text-anchor="start">Switch to the old website?</text>
<text x="524" y="164" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Your current team will open on the old website.</text>
<text x="524" y="184" font-size="14" fill="#222" font-weight="normal" text-anchor="start">Teams saved here will remain on this version.</text>
<rect x="524" y="222" width="412" height="60" rx="4" fill="#e3f0fc" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 3"/>
<circle cx="544" cy="252" r="10" fill="#b26a00" stroke="#b26a00" stroke-width="1.5"/>
<text x="544" y="257" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">!</text>
<text x="564" y="246" font-size="13" fill="#222" font-weight="normal" text-anchor="start">The old website has Generations 6–9 only.</text>
<text x="564" y="264" font-size="13" fill="#222" font-weight="normal" text-anchor="start">2 of your pokemon will not carry over.</text>
<rect x="700" y="298" width="70" height="30" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="735.0" y="318.0" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Cancel</text>
<rect x="780" y="298" width="156" height="30" rx="4" fill="#fff" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="858.0" y="318.0" font-size="13" fill="#222" font-weight="bold" text-anchor="middle">Go with my team</text>
<circle cx="488" cy="196" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="488" y="201" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<circle cx="488" cy="252" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="488" y="257" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<circle cx="952" cy="313" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="952" y="318" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<circle cx="32" cy="390" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="32" y="395" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text>
<text x="52" y="395" font-size="13" fill="#222" font-weight="normal" text-anchor="start">The current team goes with the Player to the old website (REQ-SITE-3). The way back carries nothing.</text>
<circle cx="32" cy="426" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="32" y="431" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text>
<text x="52" y="431" font-size="13" fill="#222" font-weight="normal" text-anchor="start">What will not carry over is said before leaving. The old website covers Generations 6–9, so a team</text>
<text x="52" y="449" font-size="13" fill="#222" font-weight="normal" text-anchor="start">from another generation cannot arrive whole (REQ-SITE-5, proposed by the analyst).</text>
<circle cx="32" cy="482" r="12" fill="#1565c0" stroke="#1565c0" stroke-width="1.5"/>
<text x="32" y="487" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text>
<text x="52" y="487" font-size="13" fill="#222" font-weight="normal" text-anchor="start">Saved teams stay where they were made. Bringing them across (REQ-SITE-4) was rejected in the interview.</text>
</svg>
